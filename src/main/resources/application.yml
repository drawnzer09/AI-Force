server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-force
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_force}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
