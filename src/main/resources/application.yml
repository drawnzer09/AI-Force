server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: temperature-time-series-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/temperature}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  servlet:
    multipart:
      max-request-size: ${MAX_REQUEST_SIZE:2MB}
      max-file-size: ${MAX_FILE_SIZE:2MB}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.example.temperature: ${APP_LOG_LEVEL:INFO}
