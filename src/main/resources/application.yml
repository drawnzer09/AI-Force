server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: temperature-time-series-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/temperature}
    username: ${DATABASE_USERNAME:temperature}
    password: ${DATABASE_PASSWORD:temperature}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_INCLUDE:health,info}
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_HEALTH_PROBES_ENABLED:true}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.example.temperature: ${LOGGING_LEVEL_APP:INFO}

app:
  temperature:
    max-batch-size: ${TEMPERATURE_MAX_BATCH_SIZE:1000}
    default-page-size: ${TEMPERATURE_DEFAULT_PAGE_SIZE:1000}
    max-page-size: ${TEMPERATURE_MAX_PAGE_SIZE:1000}
