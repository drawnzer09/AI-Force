server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: temperature-timeseries
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/temperature_timeseries}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

application:
  pagination:
    default-page-size: ${DEFAULT_PAGE_SIZE:100}
    max-page-size: ${MAX_PAGE_SIZE:1000}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.example.temperature: ${LOGGING_LEVEL_APPLICATION:INFO}
