server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: temperature-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/temperature}
    username: ${DATABASE_USERNAME:temperature}
    password: ${DATABASE_PASSWORD:temperature}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: ${JPA_JDBC_TIME_ZONE:UTC}
        format_sql: ${JPA_FORMAT_SQL:false}
    show-sql: ${JPA_SHOW_SQL:false}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info}
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.example.temperature: ${APPLICATION_LOG_LEVEL:INFO}
